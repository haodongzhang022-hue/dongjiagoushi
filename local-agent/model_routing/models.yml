# ============================================================
# 统一模型配置（model-routing · 唯一配置文件 · Issue #147 / #182）
# ============================================================
# 铁律：本文件是模型 ID / 渠道优先级的**唯一事实源**。
#   其他层（.cnb.yml / llm 后端 / 文档 / 测试）都从这里读取，禁止各自取名。
#
# 解析顺序：role_aliases 归一 → roles[角色] → fallback_chain → 内置兜底常量。
#   ★ Issue #182 收紧：「未列出的角色继承 default」已取消——见 fallback_chain。
# ============================================================

# ① 通用默认（role 缺失时才是这个）
#    chain = 渠道链，按优先级 1→N；主通道不通自动降级到下一档。
default:
  chain:
    - deepseek-v4.1-flash           # 主通道
    - codebuddy                     # @CodeBuddy 通道
    - glm-5.3-flash                 # 兜底

# ② 继承兜底链（角色未在 roles 中显式写出时走这条，仍属 default 体系）
#    以前未列出的角色悄悄等于 default，出问题无从发现；现在「没写」= 显式可查。
fallback_chain:
  - deepseek-v4.1-flash
  - codebuddy
  - glm-5.3-flash

# ③ 版本别名（Issue #182 · 用户说的「deepseek v4.1 flash 1017」）
#    左侧是平台/用户口语里的版本串，右侧是本配置认可的精确 ID。
#    ★ 右侧必须是平台「可选模型列表」里真实存在的 ID 才能改，写错 = 整链静默失效。
alias:
  deepseek-v4.1-flash-1017: deepseek-v4.1-flash
  deepseek-v4.1-flash-10-17: deepseek-v4.1-flash

# ④ 角色别名归一（云端传全称，配置写短名也能对上）
role_aliases:
  秘书: [架构·秘书]
  产品: [架构·产品]
  总师: [架构·总师, 架构师]
  总师助理: [架构·总师助理]
  经理: [架构·经理]
  小组长: [架构·小组长]
  开发: [架构·开发]
  评审: [架构·评审]
  测试: [架构·测试]
  交付: [架构·交付]
  数据管理员: [架构·数据管理员, 架构·数据管理]
  进度推手: [架构·进度推手]
  审核前置助手: [架构·审核前置助手]
  找需求: [架构·找需求]
  价值确认: [架构·价值确认]
  竞品分析: [架构·竞品分析]
  工具开发: [架构·工具开发]
  优化: [架构·优化]
  运维: [架构·运维]
  销售: [市场·销售]
  客服: [市场·客服]
  数据: [市场·数据]
  渠道: [市场·渠道]
  工具: [市场·工具]

# ⑤ 按角色逐个指定（Issue #182：`.cnb/settings.yml` 声明的角色全部在此显式列出）
#    写规则：chain 第一档是主档；后面是**自己认可的降级顺序**。
#    按岗位差异化的依据：写长文/长代码的给长上下文强模型，跑检查/短答的给快模型。
roles:
  "架构·秘书":   { chain: [deepseek-v4.1-flash, codebuddy, glm-5.3-flash] }   # 入口，短答为主
  "架构·产品":   { chain: [deepseek-v4.1-flash, codebuddy, glm-5.3-flash] }   # 写需求/验收标准
  "架构·总师":   { chain: [deepseek-v4.1-flash, codebuddy, glm-5.3-flash] }   # 长文架构，最吃上下文
  "架构·总师助理": { chain: [deepseek-v4.1-flash, codebuddy, glm-5.3-flash] }  # 改错改框架
  "架构·经理":   { chain: [deepseek-v4.1-flash, codebuddy, glm-5.3-flash] }   # 拆解/派活
  "架构·小组长":  { chain: [deepseek-v4.1-flash, codebuddy, glm-5.3-flash] }  # 小组整合
  "架构·开发":   { chain: [deepseek-v4.1-flash, codebuddy, glm-5.3-flash] }   # 写码，需长上下文+多步工具
  "架构·评审":   { chain: [deepseek-v4.1-flash, codebuddy, glm-5.3-flash] }   # 双轴走查
  "架构·测试":   { chain: [deepseek-v4.1-flash, codebuddy, glm-5.3-flash] }   # 跑灯出结论
  "架构·交付":   { chain: [deepseek-v4.1-flash, codebuddy, glm-5.3-flash] }   # 呈现/收尾
  "架构·数据管理员": { chain: [deepseek-v4.1-flash, codebuddy, glm-5.3-flash] }
  "架构·数据管理": { chain: [deepseek-v4.1-flash, codebuddy, glm-5.3-flash] }
  "架构·进度推手": { chain: [glm-5.3-flash, deepseek-v4.1-flash, codebuddy] }  # 打标/百分比，短任务为主，快档优先
  "架构·审核前置助手": { chain: [deepseek-v4.1-flash, codebuddy, glm-5.3-flash] }
  "架构·找需求":  { chain: [deepseek-v4.1-flash, codebuddy, glm-5.3-flash] }
  "架构·价值确认": { chain: [deepseek-v4.1-flash, codebuddy, glm-5.3-flash] }
  "架构·竞品分析": { chain: [deepseek-v4.1-flash, codebuddy, glm-5.3-flash] }
  "架构·工具开发": { chain: [deepseek-v4.1-flash, codebuddy, glm-5.3-flash] }
  "架构·优化":    { chain: [deepseek-v4.1-flash, codebuddy, glm-5.3-flash] }
  "架构·运维":    { chain: [deepseek-v4.1-flash, codebuddy, glm-5.3-flash] }
  "市场·销售":    { chain: [deepseek-v4.1-flash, codebuddy, glm-5.3-flash] }
  "市场·客服":    { chain: [glm-5.3-flash, deepseek-v4.1-flash, codebuddy] }  # 高频短答，快档优先
  "市场·数据":    { chain: [deepseek-v4.1-flash, codebuddy, glm-5.3-flash] }
  "市场·渠道":    { chain: [deepseek-v4.1-flash, codebuddy, glm-5.3-flash] }
  "市场·工具":    { chain: [deepseek-v4.1-flash, codebuddy, glm-5.3-flash] }

# ⑥ 渠道不通的判定信号（触发降级）
unavailable_signals:
  - unavailable
  - timeout
  - connection_error
  - rate_limit
  - "402"
  - "403"
  - "429"
  - "500"
  - "502"
  - "503"
  - "504"
