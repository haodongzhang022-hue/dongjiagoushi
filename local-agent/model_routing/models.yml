# ============================================================
# 统一模型配置（model-routing · 唯一配置文件 · Issue #147 / #182）
# ============================================================
# 铁律：本文件是模型 ID / 渠道优先级的**唯一事实源**。
#   其他层（.cnb.yml / llm 后端 / 文档 / 测试）都从这里读取，禁止各自取名。
#
# 解析顺序：role_aliases 归一 → roles[角色] → fallback_chain → 内置兜底常量。
#   ★ Issue #182 复评收紧（PR #184）：
#     - 「角色逐个指定」不造假差异化——只在角色**真正需要不同链**时才写进 roles；
#       其余角色一律走 fallback_chain（= default.chain），不在配置里堆空壳链。
#     - fallback_chain 通过 YAML 锚点 *default_chain **引用** default.chain，
#       配置层禁止重复字面量（改默认链只改一处）。
#     - 版本别名（alias）只在人类确认平台真实 ID 后才登记；未确认不留伪配置。
# ============================================================

# ① 通用默认（role 缺失 / 未显式指定时都是这个）
#    chain = 渠道链，按优先级 1→N；主通道不通自动降级到下一档。
#    ★ 锚点 default_chain：fallback_chain 与 roles 里未改的档位都引用它，禁止重复字面量。
default:
  chain: &default_chain
    - deepseek-v4.1-flash           # 主通道
    - codebuddy                     # @CodeBuddy 通道
    - glm-5.3-flash                 # 兜底

# ② 继承兜底链（角色未在 roles 中显式写出时走这条，仍属 default 体系）
#    通过 YAML 锚点 *default_chain 直接引用 default.chain —— 配置层零重复字面量。
fallback_chain: *default_chain

# ③ 版本别名（Issue #182 · 用户说的「deepseek v4.1 flash 1017」/「minimax 3.1 flash」）
#    左侧是平台/用户口语里的版本串，右侧是本配置认可的精确 ID。
#    ★ 铁律：右侧必须是平台「可选模型列表」里**真实存在**的 ID 才能登记；
#      写错 = 整链静默失效（#177 事故：model ... is not in the optional models list → stage error）。
#      所以本表**只接受实跑探针成功的 ID**（`python -m model_routing.cli probe <模型ID>`），
#      不接受「听说/按说/应该」。
#    ★ 未登记的版本串（带 -<数字> 后缀）在解析期**显式报红不放行**，不静默透传。
#
#    当前两个候选（用户 2026-10-20 在 PR #185 提出，待人类给真实 ID）：
#      deepseek-v4.1-flash-1017 → ?   （1017 = 版本批次口径，平台真实 ID 待确认）
#      minimax-3.1-flash        → ?   （minimax 3.1 flash，平台真实 ID 待确认）
#    确认后各补一行即可**全角色生效**，不用逐角色改：
#      # deepseek-v4.1-flash-1017: "<平台可选列表里的真实 ID>"
#      # minimax-3.1-flash:        "<平台可选列表里的真实 ID>"
alias: {}

# ④ 角色别名归一（云端传全称，配置写短名也能对上）
#    结构 {规范全名: [短名写法...]}；查配置时按全名与短名都能命中。
#    ★ 这是防御性映射：绝大多数角色走 fallback_chain，无需单独配；
#      仅当某角色被显式指定且有人用短名调用时，此表保证短名也能落到同一条配置。
role_aliases:
  架构·秘书: [秘书]
  架构·产品: [产品]
  架构·总师: [总师, 架构师]
  架构·总师助理: [总师助理]
  架构·经理: [经理]
  架构·小组长: [小组长]
  架构·开发: [开发]
  架构·评审: [评审]
  架构·测试: [测试]
  架构·交付: [交付]
  架构·数据管理员: [数据管理员, 数据管理]
  架构·进度推手: [进度推手]
  架构·审核前置助手: [审核前置助手]
  架构·找需求: [找需求]
  架构·价值确认: [价值确认]
  架构·竞品分析: [竞品分析]
  架构·工具开发: [工具开发]
  架构·优化: [优化]
  架构·运维: [运维]
  市场·销售: [销售]
  市场·客服: [客服]
  市场·数据: [数据]
  市场·渠道: [渠道]
  市场·工具: [工具]

# ⑤ 按角色显式指定（Issue #182 · 仅列**真正需要不同链**的角色）
#    写规则：chain 第一档是主档；后面是降级顺序。
#    未在此列出的角色 → 走 fallback_chain（= default.chain），不在配置里堆空壳链。
#    当前只有以下两类真正差异化（依据：该岗一轮吞吐的 token 规模 / 任务回合频率）：
#      - 进度推手 / 客服：高频短答、不需长上下文 → 快档 glm-5.3-flash 优先。
roles:
  "架构·进度推手": { chain: [glm-5.3-flash, deepseek-v4.1-flash, codebuddy] }  # 打标/百分比，短任务为主，快档优先
  "市场·客服":     { chain: [glm-5.3-flash, deepseek-v4.1-flash, codebuddy] }  # 高频短答，快档优先

# ⑥ 渠道不通的判定信号（触发降级）
unavailable_signals:
  - unavailable
  - timeout
  - connection_error
  - rate_limit
  - "402"
  - "403"
  - "429"
  - "500"
  - "502"
  - "503"
  - "504"

# ⑦ 平台侧可控参数（CNB `npc:go` options · 文档 zh/build/internal-steps/npc/go.md）
#    背景（PR #185）：用户感觉「架构·开发」慢，问「直接指定模型按说也会快」。
#    真相：模型 ID 只是其中一档；npc:go 还有一组**和模型绑定的能力参数**，
#    不显式指定时会继承平台默认模型配置，一旦换了自定义 model 就回落到内置默认值。
#    ★ 铁律：`model` 这一项仍是 `default.chain[0]` 的派生物，本文件不重复写字面量
#      （tests 里断言两者一致）；下面只声明**不派生于渠道链**的推理/上下文档位。
#    ★ 改完须同步到 `.cnb.yml` 的 `.npc_task`（npc:go 只认流水线 options，不读本文件），
#      一致性由 tests/test_model_role_assign.sh 第 ⑧ 组机器核验，不靠自觉。
npc_go:
  # 推理深度：off / minimal / low / medium / high / xhigh / max
  #   显式指定自定义 model 时平台回落到 medium；这里写死期望值，避免「以为设了其实没设」。
  thinkingLevel: medium
  # 上下文窗口：128k ~ 1m；显式指定 model 时平台回落到 1m。
  #   降它有实际收益——单轮上下文变小，溢出压缩更少触发（这是「慢」的真实主因之一）。
  contextWindow: 1m
  # 单次输出上限；显式指定 model 时平台回落到 48k。
  maxTokens: 48k
  # 最大对话轮次；显式指定 model 时平台回落到 500。
  maxTurns: 500
