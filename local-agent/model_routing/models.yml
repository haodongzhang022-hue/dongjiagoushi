# ============================================================
# 统一模型配置（model-routing · 唯一配置文件 · Issue #147 / #182）
# ============================================================
# 铁律：本文件是模型 ID / 渠道优先级的**唯一事实源**。
#   其他层（.cnb.yml / llm 后端 / 文档 / 测试）都从这里读取，禁止各自取名。
#
# 解析顺序：role_aliases 归一 → roles[角色] → fallback_chain → 内置兜底常量。
#   ★ Issue #182 复评收紧（PR #184）：
#     - 「角色逐个指定」不造假差异化——只在角色**真正需要不同链**时才写进 roles；
#       其余角色一律走 fallback_chain（= default.chain），不在配置里堆空壳链。
#     - fallback_chain 通过 YAML 锚点 *default_chain **引用** default.chain，
#       配置层禁止重复字面量（改默认链只改一处）。
#     - 版本别名（alias）只在人类确认平台真实 ID 后才登记；未确认不留伪配置。
# ============================================================

# ① 通用默认（role 缺失 / 未显式指定时都是这个）
#    chain = 渠道链，按优先级 1→N；主通道不通自动降级到下一档。
#    ★ 锚点 default_chain：fallback_chain 与 roles 里未改的档位都引用它，禁止重复字面量。
default:
  chain: &default_chain
    - deepseek-v4.1-flash           # ① 快档第一优先（主通道）
    - minimax-3.1-flash             # ② 快档第二优先
    - codebuddy                     # ③ @CodeBuddy 通道
    - glm-5.3-flash                 # ④ 快档第三优先 / 兜底（纯文本 CLI/网关可达的最后一道）

# ①' 兜底档的**平台可执行的后备单模型**（chain 档位在平台侧无法逐档跑时要降到这里）
#    npc:go 只接受一个 model 字段，链上每一档在平台侧不一定都跑得起来；
#    这一条是「连兜底话术都没得跑」时的最后可执行单模型。
#    ★ 人类 2026-10-20 在 Issue #199 拍板：快档优先级 = deepseek v4.1 flash → minimax 3.1 flash
#      → glm 5.3 flash；兜底档随之归到 glm-5.3-flash（此前的 claude-3-5-sonnet 是 AI 代选，已撤）。
last_resort_model: glm-5.3-flash

# ② 继承兜底链（角色未在 roles 中显式写出时走这条，仍属 default 体系）
#    通过 YAML 锚点 *default_chain 直接引用 default.chain —— 配置层零重复字面量。
fallback_chain: *default_chain

# ③ 版本别名（Issue #182 · 用户说的「deepseek v4.1 flash 1017」）
#    左侧是平台/用户口语里的版本串，右侧是本配置认可的精确 ID。
#    ★ 右侧必须是平台「可选模型列表」里真实存在的 ID 才能登记；
#      写错 = 整链静默失效（#177 事故）。当前人类尚未确认 1017 对应哪个真实 ID，
#      **故意留空**——不留伪配置，未登记别名一律在解析时显式报红（不放行）。
#    ★ 人类 2026-10-20 在 Issue #199 给出的是**优先级**（deepseek v4.1 flash → minimax 3.1 flash
#      → glm 5.3 flash），不是带版本后缀的平台 ID 原文；且云端无 key，`probe` 显式 skipped，
#      **未验真不登记**（#177 就是写错一个字符导致整链静默失效）。
#      故 alias 仍为空——这不是遗漏，是显式决策。真拿到 ID 原文时补一行即可：
#        deepseek-v4.1-flash-1017: <真实ID>
alias: {}

# ④ 角色别名归一（云端传全称，配置写短名也能对上）
#    结构 {规范全名: [短名写法...]}；查配置时按全名与短名都能命中。
#    ★ 这是防御性映射：绝大多数角色走 fallback_chain，无需单独配；
#      仅当某角色被显式指定且有人用短名调用时，此表保证短名也能落到同一条配置。
role_aliases:
  架构·秘书: [秘书]
  架构·产品: [产品]
  架构·总师: [总师, 架构师]
  架构·总师助理: [总师助理]
  架构·经理: [经理]
  架构·小组长: [小组长]
  架构·开发: [开发]
  架构·评审: [评审]
  架构·测试: [测试]
  架构·交付: [交付]
  架构·数据管理员: [数据管理员, 数据管理]
  架构·数据管理: [数据管理]          # 与上一条同短名：settings 里确实声明了两个条目，都要可反查
  架构·进度推手: [进度推手]
  架构·审核前置助手: [审核前置助手]
  架构·找需求: [找需求]
  架构·价值确认: [价值确认]
  架构·竞品分析: [竞品分析]
  架构·工具开发: [工具开发]
  架构·优化: [优化]
  架构·运维: [运维]
  市场·销售: [销售]
  市场·客服: [客服]
  市场·数据: [数据]
  市场·渠道: [渠道]
  市场·工具: [工具]
# ⑤ 按角色显式指定（Issue #182 · 仅列**真正需要不同链**的角色）
#    写规则：chain 第一档是主档；后面是降级顺序。
#    未在此列出的角色 → 走 fallback_chain（= default.chain），不在配置里堆空壳链。
#    当前差异化的角色（依据：该岗一轮吞吐的 token 规模 / 任务回合频率）：
#      - 进度推手 / 客服：高频短答、不需长上下文 → 挂快档三档；
#      - 开发：主力读写码、回合最多，要的是「回合快」→ 同样挂快档三档。
#    ★ 档序统一服从 Issue #199 人类拍板：deepseek-v4.1-flash → minimax-3.1-flash
#      → glm-5.3-flash（快档角色不得自排档序，与 default 链同序）。
#
#    三档语义（用户 2026-10-20 PR #185 定调 · Issue #199 确认快档档序；引擎 spec.tier_view 可读）：
#      档1 **指定**（tier=fast）——直指快档第一优先（deepseek-v4.1-flash，Issue #199 拍板）。真实快档 ID 待人类确认，
#            确认后登记 alias、再改这一处即全角色生效（先 `probe` 验真，未验真不登记，
#            防 #177 式 stage error）；
#      档2 **和其他角色一样**（tier=same）——不另造名字，直接用 `fallback_chain`
#            的模型集合（= default.chain），零字面量重复；
#      档3 **现在的兜底**（tier=last_resort）——`last_resort_model` 单模型，
#            平台侧一定跑得起来的那一道。
#    ★ 显性降级：档1→档2→档3 每一跳都写 model_routing_trace（event=model.call.fail,
#      degraded=1, fallback_from, next）；llm 层读同一份留痕判「本轮降没降级」，
#      降级就把 `degraded` 标进结果并留痕告警——绝不静默换模型。
roles:
  "架构·进度推手": { chain: [deepseek-v4.1-flash, minimax-3.1-flash, codebuddy, glm-5.3-flash] }  # 打标/百分比，短任务为主，快档优先
  "市场·客服":     { chain: [deepseek-v4.1-flash, minimax-3.1-flash, codebuddy, glm-5.3-flash] }  # 高频短答，快档优先

  # 快档角色（用户要求「最起码快档里能用上和其他几个角色一样的模型」）：
  #   chain = 档1 指定(deepseek-v4.1-flash) → 档2 与其他角色一样(default.chain) → 档3 兜底(last_resort_model)
  "架构·开发":     { chain: [deepseek-v4.1-flash, minimax-3.1-flash, codebuddy, glm-5.3-flash] }  # 读写码主力，回合多、要回合快

# ⑥ 渠道不通的判定信号（触发降级）
unavailable_signals:
  - unavailable
  - timeout
  - connection_error
  - rate_limit
  - "402"
  - "403"
  - "429"
  - "500"
  - "502"
  - "503"
  - "504"

# ⑥' 平台 npc:go 可控参数（与模型绑定的能力参数 · Issue #182 追问「换模型≠提速」）
#   ★ 显式指定自定义 model 时，平台**不再继承**默认模型配置，回落到内置默认
#     （medium / 1m / 48k / 500）；这里写死期望值，防「以为设了其实没设」。
#   ★ 一致性由 tests/test_model_role_assign.sh ⑧ 机器核验（与 .cnb.yml 的 .npc_task 逐项相等）。
npc_go:
  # 推理深度：off / minimal / low / medium / high / xhigh / max
  thinkingLevel: medium
  # 上下文窗口：128k ~ 1m；降它有实际收益——单轮上下文变小，溢出压缩更少触发（「慢」的真实主因之一）。
  contextWindow: 1m
  # 单次输出上限
  maxTokens: 48k
  # 最大对话轮次
  maxTurns: 500
