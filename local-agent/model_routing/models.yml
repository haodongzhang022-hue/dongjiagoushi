# ============================================================
# 统一模型配置（model-routing · 唯一配置文件 · Issue #147）
# ============================================================
# 用户诉求：模型指定收敛到一个配置文件统一管理——
#   - 「不指定就默认通用」：未在 roles 中单独列出的角色，一律走 default；
#   - 「允许对某个角色单独指定」：roles 下按角色名覆盖；
#   - 改模型只改这一个文件，无需跨文件检查/修改散点写死；
#   - 主通道不通 → 按 chain 顺序自动降级（非单次有效，改配置即长期生效）。
#
# 铁律：本文件是模型 ID 的唯一事实源。
#   其他层（.cnb.yml / llm 后端 / 文档 / 测试）都从这里读取，禁止各自取名。
# 解析顺序：roles[角色] → default → 内置兜底（spec 常量）。
# ============================================================

# ① 通用默认（不指定角色时用这个）
#    chain = 渠道链，按优先级 1→N；主通道不通自动降级到下一档。
#    （兼容旧写法：只写 primary/fallback 时，等价于 chain = [primary, fallback]）
default:
  chain:
    - deepseek-v4.1-flash           # ① 一选主通道（用户指定：deepseek v4.1 flash）
    - codebuddy                     # ② 二选备用（用户指定：@CodeBuddy 通道）
    - glm-5.3-flash                 # ③ 三选备用（用户指定：glm 5.3 flash）
  # 兼容字段（由 chain 派生，保持旧接口可用；改模型建议只改上面的 chain）
  primary: deepseek-v4.1-flash
  fallback: glm-5.3-flash

# ② 按角色单独指定（可选；未列出的角色自动继承 default）
#    默认不启用定制——所有角色都走 default。
#    示例（取消注释即生效，无需改代码）：
#    roles:
#      "架构·开发": { chain: [deepseek-v4.1-flash, codebuddy, glm-5.3-flash] }
#      "架构·评审": { primary: glm-5.3-flash }
roles: {}

# ③ 渠道不通的判定信号（触发降级）
unavailable_signals:
  - unavailable
  - timeout
  - connection_error
  - rate_limit
  - "402"
  - "403"
  - "429"
  - "500"
  - "502"
  - "503"
  - "504"
