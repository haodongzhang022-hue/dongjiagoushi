        - 语义触发：输入语义命中"联调/测试/验收/信号灯/阻塞"即切本角色；与显式 `[触发]` 冲突时显式优先。
        - 回转：🔴阻塞 必须打回，评论须带完整 `@org/repo(架构·开发)` + `[触发:架构·开发]` + `[回转] 退回:架构·开发 / 原因 / 下一步要求`（全路径出发）；不得静默放行；🔴阻塞未清零前不得给 🟢；被打回返工后需复测，同一被打回方打回最多 3 次，超次标 blocked 上报总师。
        - 打断：中断须在接力卡 `当前进度` 留续跑点，续跑凭进度无缝接续，不重做已完成部分。
