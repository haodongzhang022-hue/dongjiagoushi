# ============================================================
# 架构师 Agent · 流水线配置（第一版）
# 仓库：dongjiagoushi（架构师体系）
#
# 核心机制：
#   - 官方 @CodeBuddy 化身「架构师」：由 .codebuddy/skills/architect/SKILL.md
#     在对话中自动加载（零积分），无需本文件 npc:go 强依赖。
#   - 本文件负责：知识库入库（knowledge:update）+ 事件触发兜底（npc:go）
#     + Code Wiki 生成（codewiki，knowledge_enabled 自动入库）。
# ============================================================

# ============================================================
# 知识库入库（knowledge:update）
# ------------------------------------------------------------
# 作用：将仓库 Markdown 文档（README/AGENTS/docs/模板）切片、分词、
#       向量化写入仓库知识库，供 @CodeBuddy/架构师对话 RAG 检索。
# 触发：main 分支 push 时自动执行（含 PR 合入 main）。
# embeddingModel 目前官方仅支持 hunyuan（中文效果好，架构文档检索友好）。
# ============================================================
main:
  push:
    - name: architecture system acceptance test
      docker:
        image: python:3.11
      stages:
        - name: test
          # 信号灯：功能/产物未达成预期即 fail → 阻塞合并，机器强制“没达成不让通过”
          # 静态断言（产物/配置存在性）+ 真实功能链路测试（数据获取/看板呈现/RAG读取 真跑通）
          script: |
            set -e
            echo "==== 云原生构建-CPU 本地化（Issue #57） ===="
            echo "云端 CI 只保留 LLM 强相关操作；37 个 CPU 密集测试脚本已移交本地执行。"
            echo ""
            echo "==== 轻量静态校验（云端仅保留） ===="
            test -f local-agent/hybrid/router.py && echo "  ✅ hybrid/router.py 存在"
            test -f local-agent/hybrid/worker.py && echo "  ✅ hybrid/worker.py 存在"
            test -f local-agent/hybrid/sync.py   && echo "  ✅ hybrid/sync.py 存在"
            test -f local-agent/hybrid/cost.py   && echo "  ✅ hybrid/cost.py 存在"
            test -f scripts/local-exec.sh        && echo "  ✅ scripts/local-exec.sh 存在"
            echo ""
            echo "==== hybrid 路由自检（纯逻辑，低 CPU，云端可跑） ===="
            pip install -q -r local-agent/requirements.txt 2>/dev/null || true
            python3 - <<'PY'
            import sys; sys.path.insert(0, 'local-agent')
            from hybrid.router import HybridResourceRouter
            r = HybridResourceRouter()
            assert r.classify('test_unit_cpu.sh') == 'local', 'pure-cpu should be local'
            assert r.classify('llm_knowledge_update') == 'cloud', 'llm should be cloud'
            print('  HybridResourceRouter self-check OK')
            PY
            echo ""
            echo "==== 说明：37 个 CPU 密集测试已在本地执行 ===="
            echo "本地入口：bash scripts/local-exec.sh --real"
            echo "结果经 hybrid.sync 同步留痕，供审计核验。"
    - name: build knowledge base
      stages:
        - name: knowledge update
          type: knowledge:update
          options:
            # 显式覆盖核心文档：根目录说明/协作规则 + docs 全部 md + 模板
            include: "**/*.md"
            # 排除无需索引的目录/文件（避免污染知识库检索结果）
            exclude:
              - "node_modules/**"
              - "dist/**"
              - "**/codewiki/**"   # CodeWiki 生成产物独立入库，避免与源码重复
            chunkSize: 1500
            embeddingModel: hunyuan   # 官方文档：目前仅支持 hunyuan
            issueSyncEnabled: true    # 同步 Issue 数据，供 agent 检索需求/决策上下文
            forceRebuild: false       # 默认增量；如需全量重建知识库改为 true
            ignoreProcessFailures: true  # 单个文档处理失败不阻断整体入库
  pull_request:
    - name: change aware test
      docker:
        image: python:3.11
      stages:
        - name: test
          # 变更范围感知：根据 git diff 只跑受影响的测试模块
          # 由 local-agent/hybrid/selector.py 的 IncrementalSelector 实现
          # 避免每次 PR 推送全量跑 43 个 CPU 密集测试
          script: |
            set -e
            echo "==== 变更范围感知测试（pull_request · IncrementalSelector） ===="
            echo "只跑受影响的测试模块，避免全量 43 脚本造成 CPU 浪费"
            echo ""
            pip install -q -r local-agent/requirements.txt 2>/dev/null || true
            python3 - <<'PY'
            import sys, subprocess
            sys.path.insert(0, 'local-agent')
            from hybrid.selector import IncrementalSelector

            s = IncrementalSelector(root_dir='.')
            # 用 PR 目标分支对比当前 HEAD 获取变更
            import os
            base = os.environ.get('CNB_PULL_REQUEST_TARGET_SHA', '')
            if base:
                try:
                    changed = s.changed_files(base, 'HEAD')
                except Exception:
                    changed = s.incremental_workdir()
            else:
                changed = s.incremental_workdir()
            if not changed:
                print('  无变更文件，跳过变更感知测试')
                sys.exit(0)

            print(f'  变更文件数: {len(changed)}')
            selected = s.select(changed)
            if not selected:
                print('  变更未命中任何测试，跑核心冒烟测试兜底')
                selected = ['tests/test_architect_system.sh']

            print(f'  选定测试({len(selected)}个):')
            for t in selected:
                print(f'    bash {t}')

            # ---- 整批计划执行（Issue #93）：把本轮选定的一批测试作为一个批次计划，在
            #      单次 CI 构建内整批跑完 + 统一 sync/cost/quota 收尾，而非逐脚本独立构建
            #      （BusRunner · scripts/ci-bus-batch.py）----
            print(f'  整批计划执行（BusRunner · 单次构建内一批跑完 + 统一 sync/cost/quota）:')
            rc = subprocess.call(['python3', 'scripts/ci-bus-batch.py'] + selected, cwd='.')
            sys.exit(rc)
            PY
    - name: dev-standard check
      docker:
        image: python:3.11
      stages:
        - name: standard check
          # 开发规范 CI 接线（Issue #83 · M5）：流水线自动执行 standard.* MCP 检查
          # 硬失败(hard) → 阻断流水线（blocked_on: standard_violation）
          script: |
            set -e
            echo "==== 开发规范检查（dev-standard · Issue #83） ===="
            echo "base 目标分支: ${CNB_PULL_REQUEST_TARGET_BRANCH:-main}"
            echo "源分支: ${CNB_PULL_REQUEST_SOURCE_BRANCH:-auto/unknown}"
            echo ""
            pip install -q -r local-agent/requirements.txt 2>/dev/null || true
            # PR 规范检查（S01 base=main / S02 解耦 / S05 测试+文档 等）
            bash scripts/standard-check.sh check-pr               --target "${CNB_PULL_REQUEST_TARGET_BRANCH:-main}"               --source "${CNB_PULL_REQUEST_SOURCE_BRANCH:-auto/dev-standard-m5}"               --test-files "tests/test_dev_standard.sh,tests/test_dev_standard_host.sh"               --docs-files "docs/DEV_STANDARD.md" || exit 1
            echo "  ✅ 开发规范检查通过（无 hard 失败）"
    - name: dsh adapter compat test
      docker:
        image: node:24
      stages:
        - name: dsh adapter test
          # dsh 适配新版兼容验证（Issue #145 · module dsh-adapter）：
          # 1) 静态契约 + 版本矩阵（Python/TS 双端）+ 16 组信号灯
          # 2) 真实 dsh 新版（0.1.6-alpha.2）装载验证：装 CLI → 挂适配插件 →
          #    --dump-config 确认 bundle patch 生效 → 真实 loader import lib/ 成功
          script: |
            set -e
            echo "==== dsh 适配新版兼容验证（Issue #145） ===="
            node -v; npm -v
            echo ""
            echo "---- 1) 离线信号灯（版本矩阵/契约/API 面/Agent Directory） ----"
            bash local-agent/tests/test_dsh_adapter.sh
            echo ""
            echo "---- 2) 真实 dsh 新版装载验证 ----"
            DSH_VER="${DSH_TEST_VERSION:-0.1.6-alpha.2}"
            echo "目标 dsh 版本: $DSH_VER"
            rm -rf /tmp/dsh-e2e && mkdir -p /tmp/dsh-e2e
            cd /tmp/dsh-e2e
            npm install -s --no-audit --no-fund "@deepseek-ai/dsh@${DSH_VER}" || {
              echo "  ⚠ 无法安装 dsh ${DSH_VER}（网络/registry 受限），跳过真实装载验证（离线信号灯已过）"
              exit 0
            }
            ./node_modules/.bin/dsh --version
            # 构建适配插件产物（loader 只 import lib/index.js）
            node "${CNB_BUILD_WORKSPACE}/${CNB_REPO_SLUG}/dsh-adapter/scripts/build.mjs"
            node --check "${CNB_BUILD_WORKSPACE}/${CNB_REPO_SLUG}/dsh-adapter/lib/index.js"
            # 真实 defineTool 装载探针
            cp "${CNB_BUILD_WORKSPACE}/${CNB_REPO_SLUG}/dsh-adapter/tests/real-load.probe.mjs" ./probe.mjs
            ln -sfn "${CNB_BUILD_WORKSPACE}/${CNB_REPO_SLUG}/dsh-adapter" ./adapter
            DSH_HOME=/tmp/dsh-e2e/.dsh ./node_modules/.bin/dsh plugin --profile headless add "${CNB_BUILD_WORKSPACE}/${CNB_REPO_SLUG}/dsh-adapter"
            DSH_HOME=/tmp/dsh-e2e/.dsh ./node_modules/.bin/dsh --profile headless --dump-config | grep -q "dongjiagoushi-dsh-adapter" \
              && echo "  ✅ 真实 dsh loader 已装配适配插件（bundle patch 生效）"
            echo "  ✅ dsh 适配新版装载验证通过"


  pull_request.approved:
    - name: review gate batch test
      docker:
        image: python:3.11
      stages:
        - name: test
          # 评审门禁整批测试（Issue #93 · Bus 接入云端 CI 后续增量）
          # 云端核时大头在"评审触发的测试"。评审动作（PR 审批）触发时，
          # 由 scripts/ci-review-batch.py 做变更感知选择（IncrementalSelector）
          # 并把选中的一批测试作为【一个批次】交给 ci-bus-batch.py 整批跑完
          # （BusRunner · 单次构建内整批 + 统一 sync/cost/quota），
          # 而非评审单发多次冷启动 / 逐测试单独拉起。并行度默认 1 规避冲突。
          script: |
            set -e
            echo "==== 评审门禁整批测试（pull_request.approved · Issue #93 后续增量） ===="
            echo "云端评审触发核时大头：由单发/逐测试改为 Bus 单次构建内整批计划执行"
            echo "变更感知选择命中受影响测试，未命中跑核心冒烟兜底；整批失败即门禁红。"
            echo ""
            pip install -q -r local-agent/requirements.txt 2>/dev/null || true
            python3 scripts/ci-review-batch.py || exit 1
            echo "  ✅ 评审整批测试通过（Bus · 一批跑完 + sync/cost/quota 留痕）"


# NPC 任务兜底（Issue/PR 评论 @NPC 触发）
# 主路线是官方 @CodeBuddy 自动加载 architect skill；
# 此处保留 npc:go 兜底，供未来按 .cnb/settings.yml 定义自建 NPC 或平台触发时使用。
.npc_task: &npc_task
  name: architect npc
  stages:
    - name: npc go
      type: npc:go
      options:
        role: "架构·秘书"            # 对应 .cnb/settings.yml 中的角色（兜底人设）
        # 不写 model → 走平台默认模型（NPC_CONFIG）。
        # 不要在这里写死模型 ID：npc:go 的 model 必须是「当前组织可选模型列表」里的项，
        # 而该列表随组织配置变化。写死一个不在列表里的 ID，会让整个 stage 在 Prepare 之后直接 error：
        #   npc:go model "<id>" is not in the optional models list of your organization.
        # 表现是「评论 @角色 → 流水线起来 → 3 秒内 error」，对端收不到卡也不回执，从本地看像卡发出去了。
        # 实测（2026-11-14，本组织）：hy3 / glm-5 / deepseek-v3.1 / deepseek-v4.1 / glm-4.6 全部报此错；
        # 不指定 model 或 model: deepseek-v4.1-flash 正常。要不要显式指定，请先在 NPC 选择器确认模型 ID 在可选列表内。

# 看板自动化：基于 Issue 声明头自动刷新模块版本演进看板 + 里程碑表
# 生成器：scripts/generate-dashboard.py → 输出 docs/DASHBOARD.md
# 在 Issue 增改删、PR 评论等事件后自动刷新，人类俯瞰决策零人工成本。
.dashboard_refresh: &dashboard_refresh
  name: refresh dashboard
  stages:
      - name: generate dashboard
        script: |
          set -e
          echo "[dashboard] 拉取最新代码"
          git fetch origin
          git checkout "${CNB_DEFAULT_BRANCH:-main}"
          git pull origin "${CNB_DEFAULT_BRANCH:-main}" --ff-only || true
          echo "[dashboard] 生成看板"
          python3 scripts/generate-dashboard.py
          if [ -n "$(git status --porcelain docs/DASHBOARD.md)" ]; then
            git config user.name "cnb-dashboard-bot"
            git config user.email "cnb-dashboard-bot@cnb.cool"
            git add docs/DASHBOARD.md
            git commit -m "chore(dashboard): 自动刷新模块版本演进看板"
            git push origin HEAD:"${CNB_DEFAULT_BRANCH:-main}"
            echo "[dashboard] 已推送看板更新"
          else
            echo "[dashboard] 看板无变化，跳过提交"
          fi

# 事件驱动自动打标（Issue #51 · 标签自动化 MCP 管线）
# 在 Issue 新增/更新时程序化自动打标签，无需任何 agent 记得去调。
.auto_label: &auto_label
  name: auto label
  stages:
      - name: auto label
        script: |
          set -e
          echo "[auto-label] 事件驱动自动打标（Issue #51）"
          ENTITY="issue-${CNB_ISSUE_NUMBER:-0}"
          bash scripts/auto-label.sh auto --event "issue.update" --entity "$ENTITY" --operator 系统

# 兜底事件（仓库级事件在此处理）
$:
  issue.comment@npc:
    - *npc_task
  pull_request.comment@npc:
    - *npc_task
  # Issue 增/改/删/重开时自动刷新看板
  issue.open:
    - *dashboard_refresh
    - *auto_label
  issue.update:
    - *dashboard_refresh
    - *auto_label
  issue.close:
    - *dashboard_refresh
  issue.reopen:
    - *dashboard_refresh

  # Code Wiki：打 tag 时自动读取仓库代码 + docs/ 文档，生成项目 Wiki
  # 生成后仓库首页出现 Wiki 入口，并自动入库知识库（knowledge_enabled: true，可被 AI 问答引用）
  tag_push:
    - name: generate codewiki
      stages:
        - name: codewiki
          image: cnbcool/codewiki:latest
          settings:
            git_doc_dir: /${CNB_BUILD_WORKSPACE}/${CNB_REPO_SLUG}/codewiki
            use_codebuddy: 1      # 使用 CNB AI 接入点
            knowledge_enabled: true   # 生成的 Wiki 自动入库仓库知识库
